name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DHFTLOB_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        # The tests allocate dummy limits without freeing them; only report
        # memory errors, not leaks.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m unittest -v orderbook_tests
